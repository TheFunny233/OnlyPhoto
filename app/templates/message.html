{% extends "base.html" %}
{% block title %}{{ title }} — {{ app_name }}{% endblock %}
{% block content %}
<div class="max-w-[980px] mx-auto px-4 md:px-8 py-16">
  <div class="text-center py-16 px-6">
    <h1 class="text-2xl font-semibold tracking-tight text-ink">{{ title }}</h1>
    <p class="mt-2 text-body max-w-md mx-auto">{{ message }}</p>
    <div class="mt-6">
      <a href="{{ back_href }}" class="inline-flex items-center justify-center rounded-full font-medium px-6 py-3 min-h-[44px] bg-surface text-ink border border-line hover:bg-page transition-colors duration-200 ease-apple active:scale-[0.98]">{{ back_label }}</a>
    </div>
  </div>
</div>
{% endblock %}
